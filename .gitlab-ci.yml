image: python:3.12-slim

stages:
  - test

verify:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - PYTHONPATH=src python -m pytest -q
    - PYTHONPATH=src python -m morphosis.cli --contract fixtures/morphosis_contract.json --candidates fixtures/morphosis_candidates.json
