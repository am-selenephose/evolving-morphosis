<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#07111f"/>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop stop-color="#6ee7ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#eaf2ff}.m{font-family:Inter,Arial,sans-serif;fill:#91a4bf}.b{fill:#0d1b2e;stroke:#314560;stroke-width:2}.a{fill:#102640;stroke:url(#g);stroke-width:3}.h{font-weight:700}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6ee7ff"/></marker>
  </defs>
  <text x="80" y="80" class="t h" font-size="42">EVOLVING MORPHOSIS</text>
  <text x="80" y="118" class="m" font-size="21">Model-generation-resilient qualification control plane for agents</text>

  <rect x="80" y="180" rx="20" ry="20" width="270" height="150" class="b"/>
  <text x="105" y="220" class="t h" font-size="23">Candidate discovery</text>
  <text x="105" y="258" class="m" font-size="18">Bedrock / providers</text>
  <text x="105" y="286" class="m" font-size="18">OpenRouter / LiteLLM</text>
  <text x="105" y="314" class="m" font-size="18">Ollama / future model X</text>

  <rect x="445" y="180" rx="20" ry="20" width="300" height="150" class="a"/>
  <text x="470" y="220" class="t h" font-size="23">Workload contract</text>
  <text x="470" y="258" class="m" font-size="18">required capabilities</text>
  <text x="470" y="286" class="m" font-size="18">quality / cost / latency</text>
  <text x="470" y="314" class="m" font-size="18">hard invariants</text>

  <rect x="840" y="180" rx="20" ry="20" width="300" height="150" class="a"/>
  <text x="865" y="220" class="t h" font-size="23">Qualification engine</text>
  <text x="865" y="258" class="m" font-size="18">runtime probes + evals</text>
  <text x="865" y="286" class="m" font-size="18">observed capability evidence</text>
  <text x="865" y="314" class="m" font-size="18">SHA-256 evidence manifest</text>

  <rect x="1235" y="180" rx="20" ry="20" width="285" height="150" class="a"/>
  <text x="1260" y="220" class="t h" font-size="23">Promotion control</text>
  <text x="1260" y="258" class="m" font-size="18">PROMOTE</text>
  <text x="1260" y="286" class="m" font-size="18">HOLD</text>
  <text x="1260" y="314" class="m" font-size="18">REJECT</text>

  <line x1="350" y1="255" x2="445" y2="255" stroke="#6ee7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="745" y1="255" x2="840" y2="255" stroke="#6ee7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1140" y1="255" x2="1235" y2="255" stroke="#6ee7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="260" y="440" rx="24" ry="24" width="440" height="170" class="b"/>
  <text x="290" y="485" class="t h" font-size="25">Qualified runtime pool</text>
  <text x="290" y="526" class="m" font-size="19">Strands ModelRouter / provider adapter</text>
  <text x="290" y="558" class="m" font-size="19">Only evidence-qualified candidates enter</text>
  <text x="290" y="590" class="m" font-size="19">the serving pool.</text>

  <rect x="900" y="440" rx="24" ry="24" width="440" height="170" class="b"/>
  <text x="930" y="485" class="t h" font-size="25">Professional agent</text>
  <text x="930" y="526" class="m" font-size="19">ActionQueue = first workload proof</text>
  <text x="930" y="558" class="m" font-size="19">same tools + policy + evidence boundary</text>
  <text x="930" y="590" class="m" font-size="19">across model generations</text>

  <line x1="1375" y1="330" x2="1375" y2="385" stroke="#6ee7ff" stroke-width="3"/>
  <line x1="1375" y1="385" x2="480" y2="385" stroke="#6ee7ff" stroke-width="3"/>
  <line x1="480" y1="385" x2="480" y2="440" stroke="#6ee7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="525" x2="900" y2="525" stroke="#6ee7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="260" y="690" rx="18" ry="18" width="1080" height="105" class="b"/>
  <text x="290" y="730" class="t h" font-size="22">AWS-native path</text>
  <text x="290" y="765" class="m" font-size="18">Amazon Bedrock candidate surface → Strands / AgentCore evaluation → Morphosis qualification → Strands routing → Agent runtime</text>

  <path d="M1120 610 C1120 655 990 660 990 380 C990 350 1010 340 1030 330" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="1060" y="650" class="m" font-size="17">telemetry / requalification loop</text>

  <text x="80" y="855" class="m" font-size="17">Static metadata introduces a candidate. Observed workload evidence decides whether it is trusted.</text>
</svg>
